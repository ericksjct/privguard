[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "privguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tomli; python_version < '3.11'",
]

# NOTE (2026-05-07): presidio-analyzer 2.2.362 does not support Python 3.14
# upstream, so analyzer-backed detection remains gated on
# `python_version < '3.14'`. Dependencies that support Python 3.14 are not
# gated out by privguard. The lightweight detection path in
# `privguard.detection` remains fully functional. See docs/install.md.
[project.optional-dependencies]
full = [
    "presidio-analyzer==2.2.362; python_version < '3.14'",
    "presidio-anonymizer==2.2.362",
    "spacy==3.8.14; python_version < '3.14'",
]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mutmut",
]

[project.scripts]
privguard             = "privguard.cli:main"
privguard-user-prompt = "privguard.hooks:main_user_prompt"
privguard-pre-tool    = "privguard.hooks:main_pre_tool"

[tool.setuptools.packages.find]
include = ["privguard"]

[tool.setuptools.package-data]
privguard = ["data/*"]

[tool.privguard.cleanup]
# A trailing "/" means "directory tree, recursive".
# No trailing "/" means glob-style basename match (fnmatch syntax).
patterns = [
    "__pycache__/",
    "*.py[cod]",
    ".pytest_cache/",
    ".coverage",
    "htmlcov/",
    "dist/",
    "build/",
    "*.egg-info/",
]
